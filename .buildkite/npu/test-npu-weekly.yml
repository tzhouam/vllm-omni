steps:

  - group: "LingBot World NPU weekly regression"
    depends_on: upload-weekly-pipeline
    if: build.env("WEEKLY") == "1" || build.pull_request.labels includes "weekly-test"
    steps:
      - label: "Build CUDA evaluator image for NPU artifacts"
        key: lingbot-npu-weekly-evaluator-image
        source_file_dependencies: lingbot_world_regression
        timeout_in_minutes: 90
        agents:
          queue: medium_cpu_queue_premerge
        commands:
          - bash .buildkite/cuda/scripts/build-ci-image.sh
      - label: "LingBot World · NPU measured reference/candidate"
        key: lingbot-npu-weekly-generation
        source_file_dependencies: lingbot_world_regression
        timeout_in_minutes: 1440
        mirror_hardwares: a2b3_npu_4
        artifact_paths:
          - "lingbot-artifacts/npu-weekly/**/*"
        commands:
          - bash .buildkite/common/scripts/run-lingbot-ci.sh generate tests/dfx/lingbot_world/configs/npu_weekly.json lingbot-artifacts/npu-weekly
      - label: "LingBot World · NPU videos WBench/VBench gate on GPU"
        key: lingbot-npu-weekly-quality
        source_file_dependencies: lingbot_world_regression
        depends_on:
          - lingbot-npu-weekly-generation
          - lingbot-npu-weekly-evaluator-image
        timeout_in_minutes: 1440
        mirror_hardwares: h100_1
        artifact_paths:
          - "lingbot-artifacts/npu-weekly-quality/**/*"
        commands:
          - bash .buildkite/common/scripts/run-lingbot-ci.sh evaluate tests/dfx/lingbot_world/configs/npu_weekly.json lingbot-artifacts/npu-weekly-quality lingbot-artifacts/npu-weekly lingbot-npu-weekly-generation
      - label: "LingBot World · NPU long session and bounded memory"
        key: lingbot-npu-weekly-long
        source_file_dependencies: lingbot_world_regression
        timeout_in_minutes: 1440
        mirror_hardwares: a2b3_npu_4
        artifact_paths:
          - "lingbot-artifacts/npu-long/**/*"
        commands:
          - bash .buildkite/common/scripts/run-lingbot-ci.sh generate tests/dfx/lingbot_world/configs/npu_long.json lingbot-artifacts/npu-long
      - label: "LingBot World · NPU long-rollout WBench/VBench gate"
        key: lingbot-npu-weekly-long-quality
        source_file_dependencies: lingbot_world_regression
        depends_on:
          - lingbot-npu-weekly-long
          - lingbot-npu-weekly-evaluator-image
        timeout_in_minutes: 480
        mirror_hardwares: h100_1
        artifact_paths:
          - "lingbot-artifacts/npu-long-quality/**/*"
        commands:
          - bash .buildkite/common/scripts/run-lingbot-ci.sh evaluate tests/dfx/lingbot_world/configs/npu_long.json lingbot-artifacts/npu-long-quality lingbot-artifacts/npu-long lingbot-npu-weekly-long
