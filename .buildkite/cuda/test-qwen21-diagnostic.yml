# Diagnostic branch only; original runtime and workload with bounded repeats.
env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60
steps:
  - label: "Qwen-Image-2.1 H100 original workload (async)"
    key: qwen21-async
    depends_on: upload-nightly-pipeline
    mirror_hardwares: h100_1
    timeout_in_minutes: 120
    env:
      DIFFUSION_ATTENTION_BACKEND: TORCH_SDPA
    artifact_paths:
      - qwen21-diagnostic/async/**/*
    commands:
      - bash .buildkite/cuda/scripts/run-qwen21-diagnostic.sh async
  - label: "Qwen-Image-2.1 H100 original workload (blocking)"
    key: qwen21-blocking
    depends_on: upload-nightly-pipeline
    mirror_hardwares: h100_1
    timeout_in_minutes: 120
    env:
      DIFFUSION_ATTENTION_BACKEND: TORCH_SDPA
    artifact_paths:
      - qwen21-diagnostic/blocking/**/*
    commands:
      - bash .buildkite/cuda/scripts/run-qwen21-diagnostic.sh blocking
