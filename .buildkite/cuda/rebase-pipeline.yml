steps:
  - label: ":docker: Build image"
    key: image-build
    commands:
      - "bash .buildkite/cuda/scripts/build-ci-image.sh"
    agents:
      queue: "medium_cpu_queue_premerge"

  # L2 Test
  - label: "Upload Ready Pipeline"
    depends_on: image-build
    key: upload-ready-pipeline
    if: build.env("QWEN25_L4_DIAGNOSTIC") != "1"
    commands:
      - python3 .buildkite/common/scripts/upload_pipeline.py --upload --all .buildkite/cuda/test-ready.yml
    agents:
      queue: "medium_cpu_queue_premerge"

  # L3 Test
  - label: "Upload Merge Pipeline"
    depends_on: image-build
    key: upload-merge-pipeline
    if: build.env("QWEN25_L4_DIAGNOSTIC") != "1"
    commands:
      - python3 .buildkite/common/scripts/upload_pipeline.py --upload --all .buildkite/cuda/test-merge.yml
    agents:
      queue: "medium_cpu_queue_premerge"

  # L4 Test
  - label: "Upload Nightly Pipeline"
    depends_on: image-build
    key: upload-nightly-pipeline
    if: build.env("NIGHTLY") == "1"
    commands:
      - |
        if [ "${QWEN25_L4_DIAGNOSTIC:-0}" = "1" ]; then
          python3 .buildkite/common/scripts/upload_pipeline.py --upload --all .buildkite/cuda/test-qwen25-diagnostic.yml
        else
          python3 .buildkite/common/scripts/upload_pipeline.py --upload --all .buildkite/cuda/test-nightly.yml
        fi
    agents:
      queue: "medium_cpu_queue_premerge"
