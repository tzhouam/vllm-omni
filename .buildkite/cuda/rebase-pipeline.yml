steps:
  - label: ":docker: Build diagnostic image"
    key: image-build
    commands:
      - bash .buildkite/cuda/scripts/build-ci-image.sh
    agents:
      queue: medium_cpu_queue_premerge
  - label: Upload Qwen-Image diagnostic
    key: upload-nightly-pipeline
    depends_on: image-build
    commands:
      - python3 .buildkite/common/scripts/upload_pipeline.py --upload --all .buildkite/cuda/test-qwen21-diagnostic.yml
    agents:
      queue: medium_cpu_queue_premerge
