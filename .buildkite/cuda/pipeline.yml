# Independent codec candidate control; the ordinary PR pipeline is unchanged.
# Render only the dedicated image-build and five-node diagnostic pipeline.
steps:
  - label: ":github: Upload MiniCPM codec candidate control"
    key: upload-minicpm-codec-candidate-control
    commands:
      - "python3 .buildkite/common/scripts/upload_pipeline.py --all --upload .buildkite/cuda/test-minicpm-codec-candidate.yml"
    agents:
      queue: "medium_cpu_queue_premerge"
    retry:
      automatic: false
