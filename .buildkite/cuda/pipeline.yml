# Ephemeral paired source control. One fixed published M9 SDK, no image build.
# Actual native execution still requires root's review and separate authorization.
steps:
  - label: "PR9009 · paired M9/main6e8c MiniCPM SDK source E control"
    key: pr9009-minicpm-m9-main6e8c-paired-sdk-source-e-control
    agents:
      queue: mithril-h100-pool
    timeout_in_minutes: 120
    retry:
      automatic: false
    env:
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ETAG_TIMEOUT: "60"
      LINGBOT_REFERENCE_ONLY: "1"
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - image: 936637512419.dkr.ecr.us-west-2.amazonaws.com/vllm-ci-pull-through-cache/q9t5s3a7/vllm-ci-test-repo:80ef8e167cb70daffd7507fd20c2a03c1e268b31@sha256:ea6116473b124000699701056bfbdf28224761b8f26469e1f5788b060d68a937
                resources:
                  limits:
                    nvidia.com/gpu: 1
                volumeMounts:
                  - name: devshm
                    mountPath: /dev/shm
                  - name: hf-cache
                    mountPath: /root/.cache/huggingface
                env:
                  - name: HF_HOME
                    value: /root/.cache/huggingface
                  - name: VLLM_CI_HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: hf-token-secret
                        key: token
            nodeSelector:
              node.kubernetes.io/instance-type: gpu-h100-sxm
            volumes:
              - name: devshm
                emptyDir:
                  medium: Memory
              - name: hf-cache
                hostPath:
                  path: /mnt/hf-cache
                  type: DirectoryOrCreate
    artifact_paths:
      - diagnostic-artifacts/**/*
    commands:
      - |
        bash <<'PAIRED_CONTROL_BASH'
        set -euo pipefail
        if [ -n "$${VLLM_CI_HF_TOKEN:-}" ]; then export HF_TOKEN="$${VLLM_CI_HF_TOKEN}"; fi
        python3 -B .buildkite/cuda/scripts/verify_minicpm_paired_control.py \
          --execute-paired-control \
          --expected-self-sha256 54e78785bcf1e58b4a73b25df2181b128cd17eff206395586bb78f32f1f2efa4
        PAIRED_CONTROL_BASH
